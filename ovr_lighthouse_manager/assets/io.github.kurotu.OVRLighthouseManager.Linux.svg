<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#47bfff"/>
      <stop offset="0.55" stop-color="#1a9fff"/>
      <stop offset="1" stop-color="#1a44c2"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a414b"/>
      <stop offset="0.12" stop-color="#23262e"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b222b"/>
      <stop offset="1" stop-color="#05080b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9ffb0"/>
      <stop offset="0.35" stop-color="#9dc112"/>
      <stop offset="1" stop-color="#9dc112" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#06101f" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="#ffffff" opacity="0.06"/>

  <!-- signal arcs -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="9">
    <path d="M58 98 A44 44 0 0 0 58 162" opacity="0.9"/>
    <path d="M36 80 A70 70 0 0 0 36 180" opacity="0.45"/>
    <path d="M198 98 A44 44 0 0 1 198 162" opacity="0.9"/>
    <path d="M220 80 A70 70 0 0 1 220 180" opacity="0.45"/>
  </g>

  <!-- base station -->
  <g filter="url(#shadow)">
    <rect x="114" y="178" width="28" height="22" rx="5" fill="#0e141b"/>
    <rect x="92" y="194" width="72" height="12" rx="6" fill="#171d25"/>
    <rect x="72" y="70" width="112" height="118" rx="30" fill="url(#body)"/>
  </g>
  <rect x="72.5" y="70.5" width="111" height="117" rx="29.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="84" y="96" width="88" height="78" rx="20" fill="url(#lens)"/>
  <path d="M104 96 H152 A20 20 0 0 1 172 116 V122 Q128 112 84 126 V116 A20 20 0 0 1 104 96 Z" fill="url(#gloss)"/>
  <circle cx="128" cy="84" r="11" fill="url(#led)"/>
  <circle cx="128" cy="84" r="3.6" fill="#f4ffd6"/>
</svg>
